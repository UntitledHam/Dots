font_family     JetbrainsMonoNerdFont
bold_font       auto
italic_font      auto
bold_italic_font auto

background_opacity 0.90
confirm_os_window_close 0

scrollback_lines 2000
wheel_scroll_min_lines 1


allow_remote_control yes
listen_on unix:/tmp/kitty
shell_integration enabled


# kitty-scrollback.nvim Kitten alias
action_alias kitty_scrollback_nvim kitten /home/ham/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py
# Browse scrollback buffer in nvim
map kitty_mod+h kitty_scrollback_nvim
# Browse output of the last shell command in nvim
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
# Show clicked command output in nvim
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output

map f1 new_window_with_cwd

# Go to tabs
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map alt+0 goto_tab 10

map alt+, new_tab_with_cwd
map alt+shift+, close_tab
map alt+c, close_tab

enable_audio_bell no
# selection_foreground none
# selection_background none

window_padding_width 4
# foreground #dddddd
# background #000000
# cursor #dddddd

# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME
